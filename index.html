<title>Are Katike Cuts</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Rozha+One&display=swap">
<style>
/* Layout: app shell. Sticky header (delivery time + town) → sticky search → views routed by hash: home, search, shop, cart, orders, my-shops, account. Mobile bottom nav; desktop top nav. */
:root{
  --bg:#FFFFFF; --soft:#F7F2F1; --surface:#FFFFFF; --ink:#22171A; --muted:#6E6266; --faint:#9A8E91; --line:#EEE5E4;
  --brand:#8E1B2C; --brand-ink:#FFFFFF; --brand-soft:#FBEBED; --brand-deep:#4A0A15;
  --gold:#C8912F; --gold-soft:#FBF1DE; --green:#1B8A4B; --green-soft:#E5F5EC; --amber:#A45D00; --amber-soft:#FCEFDC;
  --shadow:0 1px 2px rgba(40,10,16,.06),0 6px 20px rgba(40,10,16,.08);
  --f-ui:"Outfit","Segoe UI",system-ui,sans-serif; --f-brand:"Rozha One",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131011; --soft:#1C1718; --surface:#1E191A; --ink:#F4ECEC; --muted:#B6A8AA; --faint:#8B7E80; --line:#33292A;
  --brand:#C93A50; --brand-ink:#FFFFFF; --brand-soft:#3A1A20; --brand-deep:#2A070D;
  --gold:#E0AE52; --gold-soft:#33280F; --green:#2FA866; --green-soft:#13301F; --amber:#E7A94E; --amber-soft:#36250D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131011; --soft:#1C1718; --surface:#1E191A; --ink:#F4ECEC; --muted:#B6A8AA; --faint:#8B7E80; --line:#33292A;
  --brand:#C93A50; --brand-ink:#FFFFFF; --brand-soft:#3A1A20; --brand-deep:#2A070D;
  --gold:#E0AE52; --gold-soft:#33280F; --green:#2FA866; --green-soft:#13301F; --amber:#E7A94E; --amber-soft:#36250D;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hide-sm{display:initial}
.scroller{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.scroller::-webkit-scrollbar{display:none}
.scroller>*{scroll-snap-align:start;flex-shrink:0}
.ava{border-radius:50%;object-fit:cover;background:var(--soft)}
.tick{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--green);color:#fff;flex-shrink:0}
.rating{display:inline-flex;align-items:center;gap:3px;background:var(--green);color:#fff;font-weight:700;font-size:12.5px;padding:1px 7px;border-radius:6px;line-height:1.5}
.dot-sep::before{content:"•";margin:0 6px;color:var(--faint)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:42px;height:42px;border-radius:50%}
.wm{display:flex;flex-direction:column;align-items:center;line-height:1}
.wm b{font-family:var(--f-brand);font-weight:400;font-size:19px;letter-spacing:.06em;color:var(--brand)}
.wm i{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.5em;margin-right:-.5em;color:var(--gold);margin-top:3px}
.deliver{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;padding-left:14px;border-left:1px solid var(--line)}
.deliver .eta{font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px}
.deliver .eta svg{color:var(--brand)}
.deliver .addr{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px;display:flex;align-items:center;gap:2px}
.nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.nav a{display:flex;align-items:center;gap:7px;text-decoration:none;font-weight:500;padding:8px 12px;border-radius:10px;color:var(--ink);position:relative}
.nav a:hover{background:var(--soft)}
.nav a[aria-current="page"]{color:var(--brand)}
.count{background:var(--brand);color:var(--brand-ink);font-size:11px;font-weight:700;min-width:19px;height:19px;border-radius:10px;display:inline-grid;place-items:center;padding:0 5px}

/* search bar */
.searchbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 63px);z-index:40;background:var(--bg);padding-block:12px 10px}
.sbox{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;height:50px;box-shadow:var(--shadow)}
.sbox svg{color:var(--brand);flex-shrink:0}
.sbox input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.sbox input::placeholder{color:var(--faint)}
.sbox .clear{color:var(--muted);font-size:20px;line-height:1;padding:4px}

/* sections */
.sec{padding-block:18px 6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:21px;font-weight:800}
.sec-h p{color:var(--muted);font-size:14px}
.more{color:var(--brand);font-weight:600;font-size:14px}
.divider{height:8px;background:var(--soft);margin-top:18px}

/* offers carousel */
.offer{width:min(420px,84vw);height:170px;border-radius:20px;overflow:hidden;position:relative;color:#fff;display:flex;align-items:flex-end;text-align:left}
.offer img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.offer::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(40,5,12,.92) 0%,rgba(40,5,12,.6) 55%,rgba(40,5,12,.05) 100%)}
.offer>div{position:relative;z-index:1;padding:18px;max-width:72%}
.offer small{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#F3C86B}
.offer h3{font-size:22px;font-weight:800;line-height:1.1;margin-top:4px}
.offer p{font-size:13px;opacity:.9;margin-top:6px}
.offer .cta{display:inline-block;margin-top:10px;background:#fff;color:#4A0A15;font-weight:700;font-size:13px;padding:5px 12px;border-radius:8px}
.offer.brandcard{background:radial-gradient(400px 200px at 85% 50%,#6E1020,transparent 70%),#3A0810}
.offer.brandcard::after{display:none}
.offer.brandcard img{left:auto;right:12px;top:50%;transform:translateY(-50%);width:130px;height:130px;border-radius:50%;inset:auto 12px auto auto}

/* cut circles */
.cutc{width:96px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px}
.cutc img{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--line)}
.cutc span{font-size:13.5px;font-weight:600;line-height:1.15}
.cutc[aria-pressed="true"] img{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--brand)}

/* butcher faces rail */
.face{width:118px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.face .ring{position:relative}
.face img{width:96px;height:96px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--gold)}
.face .ring .tick{position:absolute;right:2px;bottom:4px;width:22px;height:22px;border:2px solid var(--surface)}
.face b{font-size:14.5px;margin-top:4px}
.face span{font-size:12px;color:var(--muted);line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* regular shop */
.regular{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:14px;background:linear-gradient(100deg,var(--brand-soft),var(--surface) 70%)}
.regular img.ava{width:64px;height:64px;border:2px solid var(--gold);flex-shrink:0}
.regular .t{min-width:0;flex:1}
.regular small{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--brand)}
.regular h3{font-size:17px;font-weight:700}
.regular p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;border-radius:12px;padding:11px 18px;white-space:nowrap}
.btn-brand{background:var(--brand);color:var(--brand-ink)}
.btn-brand:hover{filter:brightness(1.08)}
.btn-line{border:1px solid var(--line);background:var(--surface)}
.btn-block{width:100%}

/* product cards (rails, search) */
.pcard{width:158px;display:flex;flex-direction:column;gap:6px;text-align:left}
.pcard .pi{position:relative}
.pcard .pi img{width:158px;height:132px;object-fit:cover;border-radius:14px;background:var(--soft)}
.pcard .pi .addbtn{position:absolute;right:8px;bottom:-12px}
.pcard .pt{margin-top:10px;font-size:14px;font-weight:600;line-height:1.2}
.pcard .pw{font-size:12px;color:var(--muted)}
.pcard .pp{font-weight:700;font-size:15px}
.pcard .pp s{font-weight:400;color:var(--faint);font-size:12px;margin-left:4px}
.pcard .by{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.pcard .by img{width:20px;height:20px}
.pcard .by span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addbtn{background:var(--surface);color:var(--green);border:1px solid var(--line);font-weight:800;font-size:14px;letter-spacing:.04em;border-radius:10px;padding:6px 18px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.addbtn:hover{background:var(--green-soft)}
.addbtn[disabled]{color:var(--faint);box-shadow:none;cursor:not-allowed;font-size:11px;padding:7px 10px}
.stepper{display:inline-flex;align-items:center;background:var(--green);color:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.12);font-weight:800}
.stepper button{color:#fff;width:32px;height:32px;font-size:18px;font-weight:800}
.stepper span{min-width:18px;text-align:center;font-size:14px}

/* filters */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px 12px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:700}
.sticky-chips{position:sticky;top:calc(env(safe-area-inset-top,0px) + 135px);z-index:30;background:var(--bg)}

/* shop cards (Swiggy-style) */
.shops{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px 22px}
.scard{display:flex;flex-direction:column;gap:10px;text-align:left;transition:transform .15s}
.scard:hover{transform:scale(.98)}
.scard .cov{position:relative;border-radius:18px;overflow:hidden;aspect-ratio:4/3;background:var(--soft);max-width:100%}
.scard .cov>img.c{width:100%;height:100%;object-fit:cover}
.scard .cov::after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.82))}
.scard .deal{position:absolute;left:12px;bottom:8px;z-index:1;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.01em;line-height:1.1}
.scard .owner{position:absolute;right:10px;bottom:10px;z-index:1;width:54px;height:54px;border:3px solid #fff}
.scard .fav{position:absolute;right:10px;top:10px;z-index:1;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);color:#8E1B2C;display:grid;place-items:center}
.scard .fav[aria-pressed="true"] svg{fill:#C0182F;stroke:#C0182F}
.scard .closed-tag{position:absolute;left:10px;top:10px;z-index:1;background:rgba(0,0,0,.72);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px}
.scard.closed .cov>img.c{filter:grayscale(.85)}
.scard .info{padding-inline:4px;display:flex;flex-direction:column;gap:2px;min-width:0}
.scard h3{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .meta{display:flex;align-items:center;font-weight:600;font-size:14.5px}
.scard .sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .who{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;padding:36px 16px;color:var(--muted);background:var(--soft);border-radius:18px}
.empty b{color:var(--ink);display:block;font-size:17px;margin-bottom:4px}

/* trust strip */
.trust{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.trust div{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--soft)}
.trust svg{color:var(--brand);flex-shrink:0;margin-top:2px}
.trust b{display:block;font-size:14.5px}
.trust span{font-size:13px;color:var(--muted)}
.community{margin-top:26px;border-radius:22px;background:radial-gradient(500px 240px at 90% 50%,#6E1020,transparent 70%),#2E060D;color:#FBEFE6;display:grid;grid-template-columns:auto 1fr auto;gap:22px;align-items:center;padding:24px}
.community img{width:110px;height:110px;border-radius:50%}
.community small{color:#E2B04E;font-weight:700;letter-spacing:.12em;font-size:11px}
.community h3{font-family:var(--f-brand);font-weight:400;font-size:28px;line-height:1.1;margin-top:4px}
.community p{color:#E3C3B9;font-size:14px;margin-top:6px;max-width:60ch}
.btn-gold{background:#E2B04E;color:#3A0810}

/* search view */
.recent{display:flex;flex-wrap:wrap;gap:8px}
.popular{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pop{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:left}
.pop img{width:46px;height:46px;border-radius:10px;object-fit:cover}
.pop b{font-size:14px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.res{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--surface);box-shadow:var(--shadow)}
.res+.res{margin-top:16px}
.res-h{display:flex;align-items:center;gap:12px;text-align:left;width:100%}
.res-h img.ava{width:58px;height:58px;border:2px solid var(--gold);flex-shrink:0}
.res-h .t{flex:1;min-width:0}
.res-h h3{font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0}
.res-h h3 span.n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res-h p{font-size:13px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap}
.res-h .go{color:var(--brand);font-weight:700;font-size:13px;white-space:nowrap}
.res .scroller{margin-top:14px;padding-bottom:16px}
mark{background:var(--gold-soft);color:inherit;border-radius:3px;padding:0 1px}
.res-note{font-size:12.5px;color:var(--muted);margin-top:2px}

/* shop page */
.sp-top{display:flex;align-items:center;justify-content:space-between;padding-block:10px}
.sp-top button{display:flex;align-items:center;gap:6px;font-weight:600}
.sp-card{border-radius:24px;padding:18px;background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(160deg,var(--line),var(--line)) border-box;border:1px solid var(--line);box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
.sp-card h1{font-size:26px;font-weight:800}
.sp-card .meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px 0;font-weight:600;margin-top:6px}
.sp-card .line{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--muted)}
.sp-card .line b{color:var(--ink);font-weight:600}
.sp-owner{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.sp-owner img{width:112px;height:112px;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--gold)}
.sp-owner b{font-size:14px}
.sp-owner span{font-size:12px;color:var(--green);font-weight:700;display:flex;align-items:center;gap:4px}
.quote{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--soft);font-size:14px;color:var(--muted);grid-column:1/-1}
.quote b{color:var(--ink)}
.gal img{width:220px;height:150px;border-radius:16px;object-fit:cover}
.deals .deal{border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:10px;align-items:center;min-width:240px}
.deals .deal i{font-style:normal;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:800}
.deals .deal b{display:block;font-size:14.5px}
.deals .deal span{font-size:12.5px;color:var(--muted)}
.menu-h{text-align:center;font-size:13px;letter-spacing:.3em;color:var(--muted);font-weight:600;margin-block:22px 10px}
.msearch{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:0 12px;height:44px}
.msearch input{flex:1;border:0;outline:0;background:none;font:inherit;color:var(--ink)}
.cat{padding-top:10px}
.cat>h2{font-size:19px;font-weight:800;padding-block:10px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:1fr 150px;gap:16px;padding-block:20px;border-bottom:1px dashed var(--line)}
.item .tag{font-size:12px;font-weight:700;color:var(--amber);display:flex;align-items:center;gap:4px}
.item h3{font-size:17px;font-weight:700;margin-top:2px}
.item .pr{font-weight:600;margin-top:2px}
.item .pr small{color:var(--muted);font-weight:400}
.item .ds{font-size:14px;color:var(--muted);margin-top:6px}
.item .wt{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.item .wt span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--muted)}
.item .im{position:relative;align-self:start}
.item .im img{width:150px;height:140px;object-fit:cover;border-radius:16px;background:var(--soft)}
.item .im .addbtn,.item .im .stepper{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%)}
.item .im .addbtn{padding:7px 26px}
.item .cust{font-size:11px;color:var(--faint);text-align:center;margin-top:18px}
.item.oos{opacity:.55}
.reviews .rv{width:290px;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.rv .who{display:flex;align-items:center;gap:10px}
.rv .ini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:14px}
.rv b{font-size:14px}
.rv small{color:var(--muted);font-size:12px}
.rv p{font-size:14px;color:var(--muted)}
.legal{margin-top:20px;padding:16px;background:var(--soft);border-radius:16px;font-size:13px;color:var(--muted);display:grid;gap:6px}
.legal b{color:var(--ink)}

/* cart page */
.cart-grid{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start;padding-block:16px 40px}
.cart-grid>*{min-width:0}
.box{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--surface)}
.box+.box{margin-top:14px}
.box h3{font-size:16px;font-weight:700;margin-bottom:10px}
.cshop{display:flex;align-items:center;gap:12px}
.cshop img.ava{width:52px;height:52px;border:2px solid var(--gold)}
.cshop b{font-size:17px}
.cshop p{font-size:13px;color:var(--muted)}
.cline{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding-block:12px;border-bottom:1px solid var(--line)}
.cline:last-child{border-bottom:0}
.cline img{width:52px;height:52px;border-radius:10px;object-fit:cover}
.cline b{font-size:14.5px;display:block}

function openProduct(s,p){
  if(p.addon){addItem(s,p,1,'','');return}
  const price=priceFor(s,p);
  let w=p.per?1:500,size='Medium',fat='Less fat',extra=new Set();
  const weights=p.per?[[1,'1 '+p.unit],[2,'2 '+p.unit+'s'],[3,'3 '+p.unit+'s']]:[[250,'250 g'],[500,'500 g'],[1000,'1 kg'],[1500,'1.5 kg'],[2000,'2 kg']];
  const total=()=>p.per?price*w:price*w/1000;
  const cuttable=['curry','boneless','chops'].includes(p.k);
  layer(`<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pT">
    <img class="simg" src="${imgFor(s,p)}" alt="${p.name}">
    <h2 id="pT">${p.name}</h2><p class="sub">${s.name} · cut by ${s.owner} · ${inr(price)}${p.per?' / '+p.unit:' / kg'}</p>
    <div class="opt"><b>${p.per?'Quantity':'Weight'}</b><div class="seg" data-g="w">${weights.map(([v,l])=>`<button type="button" data-v="${v}" aria-pressed="${v===w}">${l}</button>`).join('')}</div></div>
    ${cuttable?`<div class="opt"><b>Piece size</b><div class="seg" data-g="size">${['Small','Medium','Large'].map(v=>`<button type="button" data-v="${v}" aria-pressed="${v===size}">${v}</button>`).join('')}</div></div>
    <div class="opt"><b>Fat</b><div class="seg" data-g="fat">${['With fat','Less fat'].map(v=>`<button type="button" data-v="${v}" aria-pressed="${v===fat}">${v}</button>`).join('')}</div></div>`:''}
    <div class="opt"><b>Extras (free)</b><div class="seg" data-g="extra">${['Wash & clean',...(cuttable?['Add bones','Cut for biryani']:[])].map(v=>`<button type="button" data-v="${v}" aria-pressed="false">${v}</button>`).join('')}</div></div>
    <div class="opt"><b><label for="pNote">Note to ${s.owner}</label></b><textarea id="pNote" placeholder="e.g. remove extra fat, cut small"></textarea></div>
    <div class="sheet-foot"><button class="btn btn-line" type="button" data-close>Cancel</button><button class="btn btn-brand" type="button" id="pAdd">Add item · <span id="pTot" class="num">${inr(total())}</span></button></div></div>`);
  $('#layer .sheet').querySelectorAll('.seg').forEach(g=>g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const k=g.dataset.g,v=b.dataset.v;
    if(k==='extra'){extra.has(v)?extra.delete(v):extra.add(v);b.setAttribute('aria-pressed',extra.has(v));return}
    g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    if(k==='w')w=+v;if(k==='size')size=v;if(k==='fat')fat=v;$('#pTot').textContent=inr(total())}));
  $('#pAdd').onclick=()=>addItem(s,p,w,(cuttable?[size+' pieces',fat,...extra]:[...extra]).join(' · ')||'Cleaned',$('#pNote').value.trim());
}

/* ================= CART LOGIC ================= */
function pushItem(s,p,w,opts,note){
  const price=priceFor(s,p);const unit=p.addon?price:p.per?price*w:price*w/1000;
  const same=cart.items.find(i=>i.k===p.k&&i.w===w&&i.opts===opts&&i.note===note);
  if(same)same.qty++;else cart.items.push({k:p.k,name:p.name,img:imgFor(s,p),w,opts,note,unit,per:p.addon?p.unit:p.per?p.unit:null,addon:!!p.addon,qty:1});
}
function addItem(s,p,w,opts,note){
  if(cart.shop&&cart.shop!==s.id&&cart.items.length){
    const cur=shopById(cart.shop);
    layer(`<div class="sheet" role="dialog" aria-modal="true"><h2>Replace cart item?</h2><p class="sub" style="margin-top:8px">Your cart has items from <b>${cur.name}</b>. Do you want to clear it and add items from <b>${s.name}</b>?</p>
      <div class="sheet-foot"><button class="btn btn-line" type="button" data-close>No</button><button class="btn btn-brand" type="button" id="repl">Yes, replace</button></div></div>`);
    $('#repl').onclick=()=>{cart={shop:null,items:[]};addItem(s,p,w,opts,note)};return}
  cart.shop=s.id;pushItem(s,p,w,opts,note);saveCart();closeLayer();refresh();toast(`${p.short} added to cart`);
}
function changeQty(sid,k,d){
  const s=shopById(sid);const p=PRODUCTS.find(x=>x.k===k);
  if(d>0){if(p.addon){addItem(s,p,1,'','');return}const last=[...cart.items].reverse().find(i=>i.k===k);if(last){last.qty++;saveCart();refresh()}else openProduct(s,p);return}
  const idx=cart.items.map(i=>i.k).lastIndexOf(k);if(idx<0)return;
  cart.items[idx].qty--;if(cart.items[idx].qty<1)cart.items.splice(idx,1);if(!cart.items.length)cart.shop=null;saveCart();refresh();
}
function totals(){
  const s=shopById(cart.shop);const items=cart.items.reduce((a,i)=>a+i.unit*i.qty,0);
  const del=!s?0:(s.deal==='FREE DELIVERY'||items>=999)?0:(s.km<=3?20:30);
  const plat=items?5:0;const disc=coupon&&items>=499?75:0;
  return {s,items,del,plat,disc,tip:items?tip:0,total:items?items+del+plat-disc+tip:0,count:cart.items.reduce((a,i)=>a+i.qty,0)};
}
const wLabel=i=>i.per?`${i.w} ${i.per}${i.w>1?'s':''}`:(i.w>=1000?i.w/1000+' kg':i.w+' g');

/* ================= ROUTER ================= */
let curRoute='';
function route(){
  const h=location.hash.slice(1);curRoute=h;
  const sb=$('#searchbar');sb.hidden=!(h===''||h==='search');
  document.querySelectorAll('[data-nav]').forEach(a=>{const n=a.dataset.nav;a.toggleAttribute('aria-current',(n==='home'&&h==='')||n===h);if(a.hasAttribute('aria-current'))a.setAttribute('aria-current','page')});
  if(h==='search'){viewSearch();setTimeout(()=>$('#q').focus({preventScroll:true}),50)}
  else if(h==='cart')viewCart();
  else if(h==='orders')viewOrders();
  else if(h==='my-shops')viewMyShops();
  else if(h==='account')viewAccount();
  else if(/^shop-ak-[a-z]{3}-\d{4}$/.test(h)){menuQ='';viewShop(h.slice(5).toUpperCase())}
  else viewHome();
  window.scrollTo(0,0);renderBar();
}
function refresh(){
  const y=window.scrollY;const h=curRoute;
  if(h==='search')viewSearch();else if(h==='cart')viewCart();else if(h==='orders')viewOrders();else if(h==='my-shops')viewMyShops();else if(h==='account')viewAccount();
  else if(/^shop-/.test(h))viewShop(h.slice(5).toUpperCase());else viewHome();
  window.scrollTo(0,y);renderBar();
}
function renderBar(){
  const t=totals();document.querySelectorAll('[data-count]').forEach(c=>{c.hidden=!t.count;c.textContent=t.count});
  const show=t.count&&curRoute!=='cart';$('#cartbar').hidden=!show;
  if(show){$('#cbItems').textContent=`${t.count} item${t.count>1?'s':''} added · ${inr(t.items)}`;$('#cbShop').textContent='From '+t.s.name}
}
window.addEventListener('hashchange',route);

/* ================= GLOBAL EVENTS ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-fav],[data-add],[data-inc],[data-dec],[data-cut],[data-f],[data-q],[data-tab],[data-toast],[data-go],[data-go-search]');
  if(!t)return;
  if(t.dataset.fav){e.preventDefault();e.stopPropagation();const id=t.dataset.fav;const s=shopById(id);
    if(follows.includes(id)){follows=follows.filter(x=>x!==id);toast('Removed '+s.name+' from My shops')}else{follows=[id,...follows];toast(s.name+' is now your shop ♥')}
    store.set('ak_follows2',follows);refresh();return}
  if(t.dataset.add){e.preventDefault();e.stopPropagation();const [sid,k]=t.dataset.add.split('|');openProduct(shopById(sid),PRODUCTS.find(p=>p.k===k));return}
  if(t.dataset.inc){e.preventDefault();e.stopPropagation();const [sid,k]=t.dataset.inc.split('|');changeQty(sid,k,1);return}
  if(t.dataset.dec){e.preventDefault();e.stopPropagation();const [sid,k]=t.dataset.dec.split('|');changeQty(sid,k,-1);return}
  if(t.dataset.cut){cutFilter=cutFilter===t.dataset.cut?null:t.dataset.cut;viewHome();document.getElementById('allShops').scrollIntoView({behavior:'smooth'});return}
  if(t.dataset.f){const f=t.dataset.f;filt.has(f)?filt.delete(f):filt.add(f);if(f==='near')filt.delete('top');if(f==='top')filt.delete('near');if(f==='goat')filt.delete('sheep');if(f==='sheep')filt.delete('goat');const y=scrollY;viewHome();scrollTo(0,y);return}
  if(t.dataset.q!==undefined&&t.dataset.q){e.preventDefault();setQuery(t.dataset.q);if(curRoute!=='search')location.hash='search';else viewSearch();return}
  if(t.dataset.goSearch){setQuery(t.dataset.goSearch);location.hash='search';return}
  if(t.dataset.tab){tab=t.dataset.tab;viewSearch();return}
  if(t.dataset.go){location.hash=t.dataset.go;return}
  if(t.dataset.toast){toast(t.dataset.toast);return}
});
function setQuery(v){query=v;$('#q').value=v;$('#qClear').hidden=!v;tab='all';if(v&&!recent.includes(v)){recent=[v,...recent].slice(0,6);store.set('ak_recent',recent)}}
$('#q').addEventListener('input',e=>{query=e.target.value;tab='all';$('#qClear').hidden=!query;if(curRoute!=='search')location.hash='search';else viewSearch()});
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&query.trim())setQuery(query.trim())});

   <p class="sub" style="margin-top:14px">Coming next: Dharmapuri, Raikal, Mallapur. </p></div>`);
  $('#townSeg').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;town=b.dataset.t;store.set('ak_town',town);setTown();closeLayer();refresh();toast('Delivering to '+town)};
}

function setTown(){$('#addrTxt').textContent='Home · '+TOWNS[town];const near=Math.min(...SHOPS.filter(s=>s.town===town&&s.open).map(etaMin));$('#etaTxt').textContent='Delivery in '+(near+3)+' min'}
